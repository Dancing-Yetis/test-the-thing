name: Run Tests 🚀

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-code:
    name: Run Unit Tests
    runs-on: ubuntu-latest

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your preferred version
          cache: 'npm'       # Automatically caches your node_modules for speed

      - name: Execute Test Suite
        run: echo "Tested" 
